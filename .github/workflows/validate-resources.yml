name: 校验并更新研究资源索引

on:
  workflow_dispatch:
    inputs:
      commit:
        description: 提交并推送生成后的 catalog.json 与 README.md
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 运行脚本测试
        run: npm test

      - name: 检查已提交的生成文件
        run: npm run check

      - name: 重建并提交生成文件
        if: inputs.commit
        run: |
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.json README.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: 更新研究资源索引"
            git push
          fi
